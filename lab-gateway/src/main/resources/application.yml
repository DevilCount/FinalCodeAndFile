server:
  port: 8080

# JWT配置（与User Service保持一致，用于Gateway层Token验证）
jwt:
  secret: ${JWT_SECRET:LabManagementSystemSecretKey2024!@#$%ForJWTTokenGeneration}
  expiration: 86400000  # 24小时
  header: Authorization
  prefix: "Bearer "

spring:
  application:
    name: lab-gateway
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:lab-dev}
        weight: 1
        metadata:
          version: 1.0.0
      config:
        enabled: false
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:lab-dev}
        file-extension: yml
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 用户认证服务（兼容 /api/auth/** 路径）
        - id: lab-user-service-auth
          uri: lb://lab-user-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        # 用户服务
        - id: lab-user-service
          uri: lb://lab-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

        # 患者服务（复用sample-service，因为患者与标本紧密关联）
        - id: lab-patient-service
          uri: lb://lab-sample-service
          predicates:
            - Path=/api/patients/**, /api/patient/**
          filters:
            - StripPrefix=1
        
        # 标本服务
        - id: lab-sample-service
          uri: lb://lab-sample-service
          predicates:
            - Path=/api/sample/**
          filters:
            - StripPrefix=1
        
        # 报告服务
        - id: lab-report-service
          uri: lb://lab-report-service
          predicates:
            - Path=/api/report/**
          filters:
            - StripPrefix=1
        
        # HL7服务
        - id: lab-hl7-service
          uri: lb://lab-hl7-service
          predicates:
            - Path=/api/hl7/**
          filters:
            - StripPrefix=1
        
        # AI服务
        - id: lab-ai-service
          uri: lb://lab-ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1
      # 跨域配置（安全优化：限制允许的域名）
      globalcors:
        cors-configurations:
          '[/**]':
            # 允许的源（生产环境应限制为具体的前端域名）
            allowedOrigins:
              - "http://localhost:5173"     # Vite开发服务器
              - "http://localhost:3000"     # React开发服务器
              - "http://127.0.0.1:5173"
              - "http://127.0.0.1:3000"
              # 生产环境请添加实际的前端域名，例如：
              # - "https://lab.yourdomain.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    info:
      enabled: true
  server:
    port: 8080
  health:
    redis:
      enabled: false
    db:
      enabled: false

# 日志配置
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.sunyaxin: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
