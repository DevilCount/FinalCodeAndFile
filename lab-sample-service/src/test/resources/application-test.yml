# 测试配置文件
spring:
  application:
    name: lab-sample-service-test
  
  # 数据源配置（测试用内存数据库）
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # Redis配置（测试用Mock）
  redis:
    host: localhost
    port: 6379
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # 缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 60000  # 1分钟
      cache-null-values: false
  
  # 服务发现配置（测试环境禁用）
  cloud:
    nacos:
      discovery:
        enabled: false

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.sunyaxin.common.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    com.sunyaxin: DEBUG
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 测试特定配置
test:
  environment: unit-test
  mock:
    redis: true
    database: true

# Swagger配置（测试环境禁用）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 自定义配置
lab:
  system:
    name: 实验室管理系统测试环境
    version: 1.0.0-TEST
  cache:
    # 缓存过期时间（秒）
    expire-time:
      dashboard: 300     # 5分钟
      statistics: 600    # 10分钟
      user: 1800        # 30分钟
      item: 3600        # 1小时